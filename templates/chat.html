<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0d0d0d; color: #e0e0e0; height: 100vh; display: flex; overflow: hidden; }

    /* ── 사이드바 ── */
    .sidebar {
      width: 260px; min-width: 200px; background: #141414;
      border-right: 1px solid #2a2a2a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      padding: 16px; border-bottom: 1px solid #2a2a2a;
      display: flex; align-items: center; gap: 10px;
    }
    .back-btn {
      color: #4a9eff; text-decoration: none; font-size: 13px;
      padding: 4px 8px; border-radius: 4px; border: 1px solid #4a9eff;
      white-space: nowrap;
    }
    .back-btn:hover { background: #1a2a3a; }
    .sidebar-title { font-weight: 600; font-size: 14px; }

    .sidebar-section { padding: 12px 16px 6px; font-size: 11px;
                       color: #666; text-transform: uppercase; letter-spacing: 0.8px; }

    /* 컬렉션 목록 */
    .col-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .col-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; border-radius: 6px; cursor: pointer;
      font-size: 13px; transition: background 0.15s;
    }
    .col-item:hover { background: #1e1e1e; }
    .col-item.active { background: #1a2a3a; }
    .col-item input[type=checkbox] { accent-color: #4a9eff; cursor: pointer; flex-shrink: 0; }
    .col-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .col-badge { font-size: 10px; color: #666; white-space: nowrap; }

    /* 북마크 섹션 */
    .bm-list { max-height: 220px; overflow-y: auto; padding: 4px 8px 8px; }
    .bm-item {
      padding: 6px 8px; border-radius: 6px; font-size: 12px;
      cursor: pointer; display: flex; align-items: flex-start; gap: 6px;
      transition: background 0.15s; margin-bottom: 2px;
    }
    .bm-item:hover { background: #1e1e1e; }
    .bm-q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; }
    .bm-del { color: #555; font-size: 14px; line-height: 1; flex-shrink: 0; }
    .bm-del:hover { color: #e55; }
    .bm-empty { font-size: 12px; color: #444; padding: 6px 8px; }

    /* ── 메인 채팅 영역 ── */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .chat-header {
      padding: 14px 20px; background: #141414; border-bottom: 1px solid #2a2a2a;
      display: flex; align-items: center; gap: 12px;
    }
    .chat-header h1 { font-size: 16px; font-weight: 600; flex: 1;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid #333;
      background: transparent; color: #aaa; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .header-btn:hover { border-color: #555; color: #e0e0e0; }
    .header-btn.danger:hover { border-color: #e55; color: #e55; }

    /* 메시지 영역 */
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .msg { display: flex; gap: 12px; max-width: 880px; width: 100%; }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      margin-top: 2px;
    }
    .msg.user .avatar { background: #4a9eff22; }
    .msg.bot  .avatar { background: #2a2a2a; }

    .msg-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .bubble {
      padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: #4a9eff; color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot  .bubble { background: #1e1e1e; color: #e0e0e0; border-bottom-left-radius: 4px; }
    .bubble.streaming::after { content: '▋'; animation: blink 0.8s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* 소스 청크 */
    .sources { display: flex; flex-direction: column; gap: 4px; }
    .src-toggle {
      font-size: 11px; color: #4a9eff; cursor: pointer; padding: 2px 0;
      display: flex; align-items: center; gap: 4px; user-select: none;
    }
    .src-toggle:hover { color: #6ab4ff; }
    .src-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .src-chip {
      font-size: 11px; background: #252525; border: 1px solid #333;
      border-radius: 4px; padding: 3px 7px; cursor: pointer; color: #aaa;
      transition: all 0.15s; white-space: nowrap;
    }
    .src-chip:hover { background: #2a3a4a; border-color: #4a9eff; color: #4a9eff; }
    .src-chip .ts { color: #4a9eff; font-weight: 600; margin-right: 4px; }
    .src-chip .dist { color: #555; margin-left: 4px; font-size: 10px; }

    /* 액션 버튼 */
    .msg-actions { display: flex; gap: 6px; }
    .act-btn {
      font-size: 11px; color: #444; cursor: pointer; padding: 2px 6px;
      border-radius: 4px; transition: all 0.15s; user-select: none;
    }
    .act-btn:hover { color: #aaa; background: #252525; }
    .act-btn.bookmarked { color: #f5c518; }

    /* 상태 표시 */
    .status-msg { font-size: 12px; color: #555; padding: 4px 0; font-style: italic; }

    /* 비디오 플레이어 패널 */
    #video-panel {
      border-top: 1px solid #2a2a2a; background: #141414;
      display: none; flex-direction: column;
    }
    #video-panel.open { display: flex; }
    .video-panel-header {
      padding: 8px 16px; display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #aaa;
    }
    .video-panel-header span { flex: 1; }
    .close-video { cursor: pointer; color: #555; font-size: 18px; }
    .close-video:hover { color: #aaa; }
    #video-el { width: 100%; max-height: 240px; background: #000; }

    /* 입력 영역 */
    .input-area {
      padding: 16px 20px; border-top: 1px solid #2a2a2a; background: #141414;
      display: flex; gap: 10px; align-items: flex-end;
    }
    .input-wrap { flex: 1; position: relative; }
    #chat-input {
      width: 100%; background: #1e1e1e; color: #e0e0e0;
      border: 1px solid #333; border-radius: 8px;
      padding: 10px 14px; font-size: 14px; resize: none;
      max-height: 120px; min-height: 42px; line-height: 1.4;
      font-family: inherit;
    }
    #chat-input:focus { outline: none; border-color: #4a9eff; }
    #send-btn {
      padding: 10px 18px; background: #4a9eff; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
      transition: background 0.15s; white-space: nowrap; align-self: flex-end;
    }
    #send-btn:hover { background: #2a8aff; }
    #send-btn:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }

    /* 스크롤바 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>

<!-- 사이드바 -->
<div class="sidebar">
  <div class="sidebar-header">
    <a href="/" class="back-btn">← 메인</a>
    <span class="sidebar-title">RAG Chat</span>
  </div>

  <div class="sidebar-section" style="display:flex;align-items:center;justify-content:space-between">
    <span>소스 선택</span>
    <button id="reindex-btn" title="ChromaDB 재인덱싱"
      style="font-size:11px;padding:2px 8px;background:#222;color:#ccc;border:1px solid #444;border-radius:4px;cursor:pointer">↻ 재색인</button>
  </div>
  <div class="col-list" id="col-list"></div>

  <div class="sidebar-section">북마크</div>
  <div class="bm-list" id="bm-list"></div>
</div>

<!-- 메인 -->
<div class="main">
  <div class="chat-header">
    <h1 id="chat-title">RAG 챗봇</h1>
    <button class="header-btn danger" id="clear-btn" title="대화 초기화">초기화</button>
  </div>

  <div class="messages" id="messages"></div>

  <!-- 비디오 패널 -->
  <div id="video-panel">
    <div class="video-panel-header">
      <span id="video-label">영상 플레이어</span>
      <span class="close-video" id="close-video">✕</span>
    </div>
    <video id="video-el" controls></video>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="chat-input" rows="1" placeholder="질문을 입력하세요... (Shift+Enter 줄바꿈)"></textarea>
    </div>
    <button id="send-btn">전송</button>
  </div>
</div>

<script>
// ── 상태 ──────────────────────────────────────────────────────────────────
const state = {
  collections: [],      // 체크된 컬렉션 이름 목록
  history:     [],      // [{role:'user'|'assistant', content:str}]
  streaming:   false,
  videoSrc:    null,    // 현재 비디오 URL
};

// URL에서 초기 컬렉션 추출
const pathCol = decodeURIComponent(window.location.pathname.split('/').pop());

// ── 채팅 기록 영속화 (localStorage) ───────────────────────────────────────
function histKey() {
  return 'edu_chat_hist::' + [...state.collections].sort().join('|');
}
function saveHist() {
  try { localStorage.setItem(histKey(), JSON.stringify(state.history)); } catch(e) {}
}
function loadHist() {
  try {
    const raw = localStorage.getItem(histKey());
    state.history = raw ? JSON.parse(raw) : [];
  } catch(e) { state.history = []; }
  renderHistory();
}
function renderHistory() {
  messagesEl.innerHTML = '';
  for (const m of state.history) {
    if (m.role === 'user') addUserMsg(m.content, false);
    else addBotMsg(m.content, m.chunks || [], false);
  }
}

// ── DOM refs ──────────────────────────────────────────────────────────────
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chat-input');
const sendBtn    = document.getElementById('send-btn');
const colList    = document.getElementById('col-list');
const bmList     = document.getElementById('bm-list');
const videoPanel = document.getElementById('video-panel');
const videoEl    = document.getElementById('video-el');
const videoLabel = document.getElementById('video-label');

// ── 컬렉션 로드 ───────────────────────────────────────────────────────────
async function loadCollections() {
  try {
    const res  = await fetch('/api/collections');
    const cols = await res.json();
    colList.innerHTML = '';

    if (!cols.length) {
      colList.innerHTML = '<div style="font-size:12px;color:#444;padding:8px">처리된 파일 없음</div>';
      return;
    }

    cols.forEach(name => {
      const item = document.createElement('div');
      item.className = 'col-item' + (name === pathCol ? ' active' : '');

      const cb  = document.createElement('input');
      cb.type   = 'checkbox';
      cb.checked = name === pathCol;

      const lbl = document.createElement('span');
      lbl.className = 'col-name';
      lbl.textContent = name;
      lbl.title = name;

      item.appendChild(cb);
      item.appendChild(lbl);
      item.onclick = (e) => {
        if (e.target !== cb) cb.checked = !cb.checked;
        item.classList.toggle('active', cb.checked);
        updateSelectedCollections();
      };
      colList.appendChild(item);

      if (cb.checked) state.collections.push(name);
    });

    updateTitle();
    loadHist();
  } catch(e) {
    console.error(e);
  }
}

function updateSelectedCollections() {
  state.collections = [];
  colList.querySelectorAll('.col-item').forEach(item => {
    const cb = item.querySelector('input[type=checkbox]');
    if (cb && cb.checked) {
      state.collections.push(item.querySelector('.col-name').textContent);
    }
  });
  updateTitle();
  loadHist();
}

function updateTitle() {
  const title = state.collections.length
    ? state.collections.join(', ')
    : '(소스 선택 안 됨)';
  document.getElementById('chat-title').textContent = 'Chat: ' + title;
}

// ── 북마크 ───────────────────────────────────────────────────────────────
async function loadBookmarks() {
  try {
    const res = await fetch('/api/bookmarks');
    const bms = await res.json();
    renderBookmarks(bms);
  } catch(e) {}
}

function renderBookmarks(bms) {
  bmList.innerHTML = '';
  if (!bms.length) {
    bmList.innerHTML = '<div class="bm-empty">저장된 북마크 없음</div>';
    return;
  }
  bms.forEach(bm => {
    const item = document.createElement('div');
    item.className = 'bm-item';

    const q   = document.createElement('span');
    q.className = 'bm-q';
    q.textContent = bm.question;
    q.title = bm.question;
    q.onclick = () => loadBookmarkChat(bm);

    const del = document.createElement('span');
    del.className = 'bm-del';
    del.textContent = '✕';
    del.onclick = async (e) => {
      e.stopPropagation();
      await fetch(`/api/bookmarks/${bm.id}`, { method: 'DELETE' });
      loadBookmarks();
    };

    item.appendChild(q);
    item.appendChild(del);
    bmList.appendChild(item);
  });
}

function loadBookmarkChat(bm) {
  addUserMsg(bm.question, false);
  addBotMsg(bm.answer, bm.chunks || [], false);
}

async function saveBookmark(question, answer, chunks) {
  await fetch('/api/bookmarks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question, answer, chunks, collections: state.collections }),
  });
  loadBookmarks();
}

// ── 메시지 렌더링 ─────────────────────────────────────────────────────────
function addUserMsg(text, addToHistory = true) {
  const msg = document.createElement('div');
  msg.className = 'msg user';
  msg.innerHTML = `
    <div class="avatar">🧑</div>
    <div class="msg-body">
      <div class="bubble">${escHtml(text)}</div>
    </div>`;
  messagesEl.appendChild(msg);
  scrollBottom();
  if (addToHistory) { state.history.push({ role: 'user', content: text }); saveHist(); }
}

function addBotMsg(text, chunks, addToHistory = true) {
  const msg = document.createElement('div');
  msg.className = 'msg bot';

  const srcHtml = buildSourceHtml(chunks);
  const bm_id   = 'bm_' + Date.now();

  msg.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="msg-body">
      <div class="bubble">${escHtml(text)}</div>
      ${srcHtml}
      <div class="msg-actions">
        <span class="act-btn" id="${bm_id}" onclick="handleBookmark(this, '${encodeURIComponent(text)}')">☆ 북마크</span>
      </div>
    </div>`;

  // 북마크 버튼에 데이터 저장
  const bmBtn = msg.querySelector(`#${bm_id}`);
  bmBtn._question = state.history.length > 0
    ? state.history[state.history.length - 1]?.content ?? '' : '';
  bmBtn._answer   = text;
  bmBtn._chunks   = chunks;

  messagesEl.appendChild(msg);
  scrollBottom();
  if (addToHistory) { state.history.push({ role: 'assistant', content: text, chunks }); saveHist(); }
}

function buildSourceHtml(chunks) {
  if (!chunks || !chunks.length) return '';
  const chips = chunks.map(c => {
    const ts   = c.ts || '';
    const src  = c.source ? `[${c.source}] ` : '';
    const dist = c.dist   ? `${c.dist}` : '';
    const preview = (c.text || '').substring(0, 60).replace(/"/g, '&quot;');
    return `<span class="src-chip" title="${preview}" onclick="handleTimestamp('${c.source||''}','${ts}')">`
         + `<span class="ts">${escHtml(ts)}</span>${escHtml(src)}<span class="dist">${dist}</span></span>`;
  }).join('');
  return `<div class="sources">
    <div class="src-toggle" onclick="this.nextElementSibling.classList.toggle('hidden')">
      📎 참고 자료 (${chunks.length}개) ▾
    </div>
    <div class="src-chips">${chips}</div>
  </div>`;
}

// 스트리밍 봇 메시지 생성
function createStreamingMsg() {
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'streaming-msg';
  msg.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="msg-body">
      <div class="bubble streaming" id="streaming-bubble"></div>
      <div class="status-msg" id="streaming-status"></div>
    </div>`;
  messagesEl.appendChild(msg);
  scrollBottom();
  return msg;
}

function updateStreamingStatus(text) {
  const el = document.getElementById('streaming-status');
  if (el) {
    const MAP = {
      searching:    '🔍 관련 내용 검색 중...',
      loading_llm:  '⚙️ AI 모델 로딩 중...',
      generating:   '✍️ 답변 생성 중...',
    };
    el.textContent = MAP[text] || text;
  }
}

function appendStreamingToken(token) {
  const el = document.getElementById('streaming-bubble');
  if (el) {
    el.textContent += token;
    scrollBottom();
  }
}

function finalizeStreamingMsg(chunks) {
  const msg = document.getElementById('streaming-msg');
  if (!msg) return;

  const bubble = document.getElementById('streaming-bubble');
  bubble.classList.remove('streaming');
  const fullText = bubble.textContent;

  const statusEl = document.getElementById('streaming-status');
  if (statusEl) statusEl.remove();

  // 소스 + 북마크 버튼 추가
  const srcHtml = buildSourceHtml(chunks);
  const bm_id   = 'bm_' + Date.now();
  const body    = msg.querySelector('.msg-body');
  body.insertAdjacentHTML('beforeend',
    srcHtml + `<div class="msg-actions">
      <span class="act-btn" id="${bm_id}">☆ 북마크</span>
    </div>`
  );

  const lastUserMsg = [...state.history].reverse().find(h => h.role === 'user');
  const bmBtn = body.querySelector(`#${bm_id}`);
  bmBtn._question = lastUserMsg?.content ?? '';
  bmBtn._answer   = fullText;
  bmBtn._chunks   = chunks;
  bmBtn.onclick   = () => handleBookmark(bmBtn, encodeURIComponent(fullText));

  msg.removeAttribute('id');
  state.history.push({ role: 'assistant', content: fullText, chunks });
  saveHist();
}

// ── 북마크 핸들러 ─────────────────────────────────────────────────────────
function handleBookmark(btn, _encodedText) {
  const q = btn._question;
  const a = btn._answer;
  const c = btn._chunks;
  if (!q || !a) return;
  saveBookmark(q, a, c);
  btn.textContent = '★ 북마크됨';
  btn.classList.add('bookmarked');
}

// ── 타임스탬프 클릭 → 영상 플레이어 ─────────────────────────────────────
async function handleTimestamp(source, ts) {
  if (!ts || ts === '요약') return;
  const secs = tsToSecs(ts);
  const stem = source || (state.collections[0] ?? '');
  if (!stem) return;

  try {
    const res   = await fetch(`/api/output-info/${stem}`);
    const files = await res.json();
    // dubbed_ 우선, 없으면 원본 mp4
    const videoFile = files.find(f => f.startsWith('dubbed_') && f.endsWith('.mp4'))
                   ?? files.find(f => f.endsWith('.mp4'));
    if (!videoFile) return;

    const url = `/api/output/${stem}/${encodeURIComponent(videoFile)}`;
    openVideoAt(url, secs, stem);
  } catch(e) {
    console.error('영상 로드 실패:', e);
  }
}

function openVideoAt(url, secs, label) {
  videoEl.src    = url;
  videoLabel.textContent = label;
  videoPanel.classList.add('open');
  videoEl.onloadedmetadata = () => {
    videoEl.currentTime = secs;
    videoEl.play().catch(() => {});
  };
}

function tsToSecs(ts) {
  const parts = ts.split(':').map(Number);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return 0;
}

document.getElementById('close-video').onclick = () => {
  videoPanel.classList.remove('open');
  videoEl.pause();
  videoEl.src = '';
};

// ── 전송 ─────────────────────────────────────────────────────────────────
async function sendMessage() {
  const question = inputEl.value.trim();
  if (!question || state.streaming) return;
  if (!state.collections.length) {
    alert('왼쪽 사이드바에서 소스를 최소 1개 선택하세요.');
    return;
  }

  inputEl.value = '';
  autoResizeInput();
  addUserMsg(question);
  state.streaming = true;
  sendBtn.disabled = true;

  createStreamingMsg();
  let chunks = [];

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        collections: state.collections,
        threshold:   0.6,
        history:     state.history.slice(-10).map(m => ({ role: m.role, content: m.content })),
      }),
    });

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let   buf     = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.status) updateStreamingStatus(data.status);
          if (data.chunks) chunks = data.chunks;
          if (data.token)  appendStreamingToken(data.token);
          if (data.done || data.error) break;
        } catch(e) {}
      }
    }
  } catch(e) {
    appendStreamingToken('\n[오류: ' + e.message + ']');
  } finally {
    finalizeStreamingMsg(chunks);
    state.streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// ── 초기화 ───────────────────────────────────────────────────────────────
document.getElementById('clear-btn').onclick = () => {
  if (!confirm('대화 내용을 모두 지울까요?')) return;
  state.history = [];
  messagesEl.innerHTML = '';
  try { localStorage.removeItem(histKey()); } catch(e) {}
};

// ── 입력 자동 크기 조절 ───────────────────────────────────────────────────
function autoResizeInput() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}
inputEl.addEventListener('input', autoResizeInput);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.onclick = sendMessage;

// ── 유틸 ─────────────────────────────────────────────────────────────────
function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── 재인덱싱 ─────────────────────────────────────────────────────────────
document.getElementById('reindex-btn').onclick = async () => {
  if (!confirm('모든 소스를 ChromaDB에 다시 색인할까요?\n(segments.json 기준으로 복구됩니다)')) return;
  const btn = document.getElementById('reindex-btn');
  const orig = btn.textContent;
  btn.textContent = '진행 중…';
  btn.disabled = true;
  try {
    const res = await fetch('/api/reindex-all', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    btn.textContent = '✓ 완료';
    setTimeout(() => loadCollections(), 800);
  } catch(e) {
    btn.textContent = '오류';
    alert('재인덱싱 실패: ' + e.message);
  } finally {
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
  }
};

// ── 초기 로드 ─────────────────────────────────────────────────────────────
loadCollections();
loadBookmarks();
inputEl.focus();
</script>
